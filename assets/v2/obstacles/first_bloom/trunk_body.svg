<svg xmlns="http://www.w3.org/2000/svg" width="160" height="320" viewBox="0 0 160 320">
    <defs>
      <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#5D403B"/>
        <stop offset="40%" stop-color="#8D5B4C"/>
        <stop offset="100%" stop-color="#5D403B"/>
      </linearGradient>
    </defs>
    <!-- Solid arcade cel-shaded wooden pillar -->
    <rect x="18" y="0" width="124" height="320" fill="url(#wood)" stroke="#331E1A" stroke-width="6"/>
    <!-- Left highlight cylinder band -->
    <rect x="21" y="0" width="26" height="320" fill="#FFE0D6" opacity=".22"/>
    <line x1="22" y1="0" x2="22" y2="320" stroke="#FFFFFF" stroke-width="3" opacity=".35"/>
    <!-- Right deep shadow cylinder band -->
    <rect x="106" y="0" width="33" height="320" fill="#1A0D0B" opacity=".42"/>
    <line x1="106" y1="0" x2="106" y2="320" stroke="#1A0D0B" stroke-width="2.5" opacity=".5"/>
    <!-- Stylized wood grain lines -->
    <path d="M48 0 C44 55 64 110 52 170 C42 220 56 275 50 320" stroke="#FFE0D6" stroke-width="3.5" opacity=".3" fill="none"/>
    <path d="M84 0 C94 65 76 135 86 200 C96 250 80 290 84 320" stroke="#1A0D0B" stroke-width="3" opacity=".35" fill="none"/>
    <!-- Stylized tree knots -->
    <ellipse cx="68" cy="120" rx="9" ry="14" fill="#331E1A" stroke="#1A0D0B" stroke-width="2.5"/>
    <ellipse cx="68" cy="120" rx="4.5" ry="7.5" fill="#8D5B4C"/>
    <path d="M68 104 C78 108 78 132 68 136" stroke="#FFE0D6" stroke-width="2" opacity=".4" fill="none"/>
    <ellipse cx="94" cy="245" rx="7" ry="11" fill="#331E1A" stroke="#1A0D0B" stroke-width="2"/>
    <ellipse cx="94" cy="245" rx="3.5" ry="5.5" fill="#8D5B4C"/>
</svg>